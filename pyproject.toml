[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xtpress"
version = "0.1.0"
description = "Expected Threat and pressing analysis on StatsBomb open data"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["xtpress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
